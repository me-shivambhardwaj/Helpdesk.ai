version: "3.8"

services:
  support-agent:
    build: .
    container_name: support-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist SQLite database and vector database across container restarts
      - ./tickets.db:/app/tickets.db
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped
