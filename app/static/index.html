<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelpDesk AI</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#e3e3de;--accent:#2f5bea;
--ok:#1a7f4b;--warn:#b26a00;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--text:#ececE8;--muted:#9a9a93;--line:#34342f;--accent:#7b9bff;
--ok:#4cc38a;--warn:#e0a040;--bad:#ef7b6e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:900px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 16px}
nav{display:flex;gap:8px;margin-bottom:20px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;padding:10px 14px;color:var(--muted);font:inherit;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--text);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px}
.big{font-size:28px;font-weight:600}.label{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row span:first-child{width:130px;color:var(--muted)}
.bar{height:10px;background:var(--accent);border-radius:5px;min-width:4px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);margin-right:4px}
.tag.escalated,.tag.high,.tag.angry{color:var(--bad);border-color:var(--bad)}
.tag.needs_approval,.tag.medium,.tag.negative{color:var(--warn);border-color:var(--warn)}
.tag.auto_resolved,.tag.approved{color:var(--ok);border-color:var(--ok)}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;margin:4px 0 12px}
textarea{min-height:110px;resize:vertical}
button.primary{background:var(--accent);color:#fff;border:0;padding:10px 18px;border-radius:8px;font:inherit;cursor:pointer}
button.primary:disabled{opacity:.6;cursor:wait}
.muted{color:var(--muted)}.hide{display:none}
pre{white-space:pre-wrap;font:inherit;margin:8px 0}
</style>
</head>
<body>
<main>
<h1>HelpDesk AI</h1>
<nav>
  <button data-tab="metrics" class="on">Metrics</button>
  <button data-tab="queue">Review queue</button>
  <button data-tab="new">Submit ticket</button>
</nav>

<section id="metrics"></section>
<section id="queue" class="hide"></section>
<section id="new" class="hide">
  <div class="card">
    <label class="label">Customer email</label>
    <input id="customer" value="test@example.com">
    <label class="label">Subject</label>
    <input id="subject">
    <label class="label">Message</label>
    <textarea id="body"></textarea>
    <button class="primary" id="submit">Process ticket</button>
  </div>
  <div id="result"></div>
</section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tag = v => `<span class="tag ${esc(v)}">${esc(v)}</span>`;
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  ["metrics", "queue", "new"].forEach(id => $("#" + id).classList.toggle("hide", id !== b.dataset.tab));
  if (b.dataset.tab === "metrics") loadMetrics();
  if (b.dataset.tab === "queue") loadQueue();
});

function bars(obj) {
  const max = Math.max(1, ...Object.values(obj));
  return Object.entries(obj).map(([k, v]) =>
    `<div class="row"><span>${esc(k)}</span><div class="bar" style="width:${(v / max) * 60}%"></div><span>${v}</span></div>`).join("");
}

async function loadMetrics() {
  const m = await api("/metrics");
  $("#metrics").innerHTML = `
    <div class="grid">
      <div class="card"><div class="label">Total tickets</div><div class="big">${m.total}</div></div>
      <div class="card"><div class="label">Auto-resolved</div><div class="big">${m.auto_resolved_pct}%</div></div>
      <div class="card"><div class="label">Avg response time</div><div class="big">${m.avg_response_seconds ?? "-"}${m.avg_response_seconds ? "s" : ""}</div></div>
    </div>
    <div class="card"><div class="label">By category</div>${bars(m.by_category) || '<p class="muted">No data yet.</p>'}</div>
    <div class="card"><div class="label">By status</div>${bars(m.by_status) || '<p class="muted">No data yet.</p>'}</div>`;
}

async function loadQueue() {
  const all = await api("/tickets");
  const pending = all.filter(t => t.status === "needs_approval" || t.status === "escalated");
  if (!pending.length) { $("#queue").innerHTML = '<p class="muted">Nothing waiting for review.</p>'; return; }
  $("#queue").innerHTML = pending.map(t => {
    let sources = []; try { sources = JSON.parse(t.sources || "[]"); } catch {}
    return `<div class="card">
      <div>#${t.id} ${tag(t.status)} ${tag(t.category)} ${tag(t.urgency)} ${tag(t.sentiment)}</div>
      <p><strong>${esc(t.subject)}</strong> <span class="muted">from ${esc(t.customer)}</span></p>
      <pre>${esc(t.body)}</pre>
      <p class="muted">Summary: ${esc(t.summary)}<br>Sources: ${esc(sources.join(", ") || "none")}</p>
      <textarea id="r${t.id}">${esc(t.draft)}</textarea>
      <button class="primary" data-id="${t.id}">Approve &amp; send</button>
    </div>`;
  }).join("");
  document.querySelectorAll("#queue button[data-id]").forEach(btn => btn.onclick = async () => {
    const id = btn.dataset.id;
    await api(`/tickets/${id}/approve`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({final_reply: $("#r" + id).value})});
    loadQueue();
  });
}

$("#submit").onclick = async () => {
  const btn = $("#submit");
  const payload = {customer: $("#customer").value, subject: $("#subject").value, body: $("#body").value};
  if (!payload.subject || !payload.body) return;
  btn.disabled = true; btn.textContent = "Processing...";
  try {
    const r = await api("/tickets", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)});
    $("#result").innerHTML = `<div class="card">
      <div>Ticket #${r.id} ${tag(r.status)} ${tag(r.category)} ${tag(r.urgency)} ${tag(r.sentiment)}</div>
      <p class="muted">${esc(r.summary)}</p>
      ${r.draft ? `<div class="label">Draft reply</div><pre>${esc(r.draft)}</pre>` : '<p class="muted">No draft: the knowledge base had no relevant answer.</p>'}
    </div>`;
  } catch (e) {
    $("#result").innerHTML = `<div class="card"><span class="tag high">error</span><pre>${esc(e.message)}</pre></div>`;
  }
  btn.disabled = false; btn.textContent = "Process ticket";
};

loadMetrics();
</script>
</body>
</html>
